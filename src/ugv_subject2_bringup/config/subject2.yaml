lio_odom_adapter:
  ros__parameters:
    input_topic: /livox_odometry_mapped
    output_topic: /localization/odom
    raw_world_frame: world
    raw_lidar_frame: livox_frame
    odom_frame: odom
    base_frame: base_link
    # Launch enables this only after all six base_link -> livox_frame values
    # and their provenance are supplied explicitly.
    extrinsics_valid: false

map_odom_manager:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    # Field contract: map and odom origins/axes are aligned manually.
    auto_align_from_path: false
    publish_rate_hz: 20.0
    initial.x: 0.0
    initial.y: 0.0
    initial.z: 0.0
    initial.roll: 0.0
    initial.pitch: 0.0
    initial.yaw: 0.0

gga_serial:
  ros__parameters:
    # The launch file creates this optional node only when a complete, explicit
    # serial configuration is supplied. GPS is not a control input.
    antenna_frame: gps_link
    fix_topic: /gps/fix
    position_valid_topic: /gps/gga_position_valid
    raw_sentence_topic: /gps/gga_sentence
    poll_rate_hz: 50.0
    status_rate_hz: 5.0
    fix_timeout_sec: 1.0
    reconnect_period_sec: 2.0
    maximum_sentence_length: 128
    accepted_sentence_ids: [GPGGA]
    quality_profile_valid: false
    accepted_fix_qualities: [1, 2, 4, 5, 6, 8, 9]
    minimum_satellites: 1
    maximum_hdop: 99.0

waypoint_controller_node:
  ros__parameters:
    # Cruise request and hard cap are intentionally separate. The current
    # requested cruise remains 0.50 m/s; the user-set cap is 1.00 m/s.
    nominal_speed: 0.50
    max_speed: 1.00
    # Confirmed chassis breakaway thresholds require 1.50 while turning in
    # place and 1.00 while moving. The hard cap must not be below either floor.
    max_yaw_rate: 1.50
    max_curvature: 1.00
    enhanced_tracking_enabled: true
    minimum_linear_speed: 0.50
    minimum_tracking_yaw_rate: 1.00
    minimum_turning_yaw_rate: 1.50
    # The field route has five sparse points, 21.55--27.61 m apart, with only
    # 0.48--6.47 degree heading changes. Interpolate a pursuit point 2.0 m
    # ahead at the current 0.50 m/s cruise instead of aiming at a far CSV row.
    lookahead_min_m: 1.50
    lookahead_max_m: 3.00
    lookahead_speed_gain: 1.00
    # Retained as a diagnostic threshold. While ALIGN remains active the
    # stationary yaw floor stays in force; it never drops to the moving floor.
    turning_motion_threshold_rad: 0.05
    # Enter/exit hysteresis prevents ALIGN/TRACK chatter. TRACK thresholds are
    # applied to the standard Pure Pursuit raw omega before the chassis floor.
    turn_in_place_threshold_rad: 0.70
    turn_in_place_exit_threshold_rad: 0.20
    tracking_omega_enter_threshold_rad_s: 0.05
    tracking_omega_exit_threshold_rad_s: 0.02
    slowdown_distance: 1.20
    waypoint_tolerance: 0.50
    goal_tolerance: 0.50
    transform_timeout_sec: 0.05
    odom_topic: /localization/odom
    odom_frame: odom
    base_frame: base_link
    expected_path_frame: map
    # Decouple /cmd_vel publication from the LIO callback. The command lease
    # must be strictly longer than two publication periods.
    command_publish_rate_hz: 20.0
    command_hold_timeout_sec: 0.30
    tracking_yaw_pulse_enabled: true
    tracking_yaw_min_pulse_sec: 0.10
    tracking_yaw_demand_gain: 1.0
    # Optional chassis breakaway helper. It is disabled by default and in the
    # field-validated profile below; enable it only for a dedicated test.
    stall_boost_enabled: false
    stall_detection_duration_sec: 0.80
    stall_observation_gap_reset_sec: 0.30
    stall_motion_translation_threshold_m: 0.05
    stall_motion_yaw_threshold_rad: 0.03
    stall_min_linear_command_mps: 0.30
    stall_min_angular_command_rad_s: 0.50
    stall_linear_boost_speed_mps: 1.00
    stall_angular_boost_rate_rad_s: 1.50
    stall_boost_min_duration_sec: 0.40
    stall_boost_max_duration_sec: 1.00
    stall_boost_ramp_down_sec: 0.80
    stall_boost_cooldown_sec: 1.00
    stall_boost_max_attempts: 3
