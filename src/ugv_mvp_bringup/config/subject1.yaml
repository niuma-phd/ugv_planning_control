lio_odom_adapter:
  ros__parameters:
    input_topic: /livox_odometry_mapped
    output_topic: /localization/odom
    raw_world_frame: world
    raw_lidar_frame: livox_frame
    odom_frame: odom
    base_frame: base_link
    extrinsics_valid: false

map_odom_manager:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    auto_align_from_path: false
    require_odom_invalid_for_update: false
    publish_rate_hz: 20.0
    initial.x: 0.0
    initial.y: 0.0
    initial.z: 0.0
    initial.roll: 0.0
    initial.pitch: 0.0
    initial.yaw: 0.0

obstacle_detector_node:
  ros__parameters:
    base_frame: base_link
    input_timeout_s: 0.30
    tf_timeout_s: 0.10
    min_finite_points: 1
    roi_min_x: 0.20
    roi_max_x: 8.00
    roi_min_y: -3.00
    roi_max_y: 3.00
    # Candidate body-frame height band; replace from measured TF/ground data.
    min_z: 0.10
    max_z: 1.50
    # Candidate self box; replace from measured vehicle footprint.
    self_min_x: -1.00
    self_max_x: 1.00
    self_min_y: -0.60
    self_max_y: 0.60
    cell_size: 0.15
    min_points: 3
    corridor_min_x: 0.30
    corridor_max_x: 4.00
    corridor_half_width: 0.80

local_avoidance_node:
  ros__parameters:
    frame_id: base_link
    publish_rate_hz: 20.0
    input_timeout_s: 0.30
    speed_mps: 0.10
    max_curvature: 1.00
    curvature_samples: 31
    horizon_m: 3.00
    step_m: 0.10
    # Candidate footprint; replace from Section 4 measurement.
    footprint_half_length_m: 1.00
    footprint_half_width_m: 0.60
    inflation_m: 0.30
    goal_distance_weight: 1.00
    heading_weight: 0.50
    curvature_weight: 0.15
    clearance_weight: 0.70
    max_clearance_reward_m: 2.00
