lio_odom_adapter:
  ros__parameters:
    input_topic: /livox_odometry_mapped
    output_topic: /localization/odom
    raw_world_frame: world
    raw_lidar_frame: livox_frame
    odom_frame: odom
    base_frame: base_link
    # Use relative_to_ros only when the source is confirmed to publish a
    # strictly increasing device-relative clock instead of ROS epoch time.
    timestamp_mode: source
    # Overridden by launch arguments only after the Horizon measurement is approved.
    extrinsics_valid: false

map_odom_manager:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    # Temporary Subject 2 assumption: map and odom are the same frame origin.
    auto_align_from_path: false
    require_odom_invalid_for_update: true
    publish_rate_hz: 20.0
    initial.x: 0.0
    initial.y: 0.0
    initial.z: 0.0
    initial.roll: 0.0
    initial.pitch: 0.0
    initial.yaw: 0.0

odom_guard:
  ros__parameters:
    input_topic: /localization/odom
    trusted_topic: /localization/trusted_odom
    valid_topic: /localization/odom_valid
    expected_frame_id: odom
    expected_child_frame_id: base_link
    snapshot_directory: /home/sunrise/.ros/ugv_mvp
    snapshot_basename: last_good_subject2_odom
    watchdog_rate_hz: 20.0
    # Guard persistence threshold; the controller independently stops on its
    # 0.30 s receive timeout before this fault is latched.
    max_age_s: 0.50
    future_tolerance_s: 0.05
    quaternion_norm_tolerance: 0.05
    # Candidate values: replace from healthy Horizon/LIO bag statistics.
    max_translation_jump_m: 1.50
    max_yaw_jump_rad: 0.80

gga_serial:
  ros__parameters:
    # The launch file does not create this node until an explicit device and
    # complete serial framing are supplied. It never scans /dev or the RDK.
    antenna_frame: gps_link
    fix_topic: /gps/fix
    position_valid_topic: /gps/gga_position_valid
    raw_sentence_topic: /gps/gga_sentence
    poll_rate_hz: 50.0
    status_rate_hz: 5.0
    fix_timeout_sec: 1.0
    reconnect_period_sec: 2.0
    maximum_sentence_length: 128
    accepted_sentence_ids: [GPGGA]
    # These documented GGA codes are candidates only. The validity topic stays
    # false until the real receiver profile and thresholds are reviewed.
    quality_profile_valid: false
    accepted_fix_qualities: [1, 2, 4, 5, 6, 8, 9]
    minimum_satellites: 1
    maximum_hdop: 99.0

recovery_coordinator:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    # GGA has no yaw and therefore cannot produce the complete map-frame pose
    # required for safe map->odom recovery. Healthy control still uses LIO.
    automatic_recovery_enabled: false
    heartbeat_rate_hz: 10.0
    input_timeout_sec: 1.0
    future_stamp_tolerance_sec: 0.10
    # Each recovery phase is bounded. A timeout leaves navigation disabled
    # until the complete localization stack is restarted manually.
    # The service budget covers supervisor TERM (5 s), KILL (5 s), LIO
    # startup grace (3 s), and scheduling margin.
    recovery_timeout_sec: 20.0
    service_timeout_sec: 15.0
    # Avoid treating odom_guard's startup false sample as a real LIO fault.
    # Must remain shorter than input_timeout_sec so a real startup fault still
    # has a fresh last-trusted anchor when recovery begins.
    startup_invalid_grace_sec: 0.25
    gps_sample_count: 5
    odom_sample_count: 5
    startup_odom_samples: 5
    max_recovery_attempts: 1
    # Candidate quality gates. Replace them from the approved GPS/global-pose
    # source and stationary field measurements before vehicle use.
    max_gps_position_covariance: 4.0
    max_gps_yaw_covariance: 0.25
    max_gps_window_position_span_m: 0.75
    max_gps_window_yaw_span_rad: 0.35
    max_odom_window_position_span_m: 0.30
    max_odom_window_yaw_span_rad: 0.20
    max_alignment_stamp_skew_sec: 0.20
    max_anchor_correction_m: 10.0
    max_anchor_correction_yaw_rad: 1.57
    echo_translation_tolerance_m: 0.02
    echo_yaw_tolerance_rad: 0.02
    final_position_tolerance_m: 1.0
    final_yaw_tolerance_rad: 0.35

waypoint_controller_node:
  ros__parameters:
    control_rate_hz: 20.0
    nominal_speed: 0.50
    max_speed: 0.50
    max_yaw_rate: 0.40
    max_curvature: 1.00
    lookahead_distance: 0.80
    use_speed_scaled_lookahead: false
    lookahead_speed_gain: 0.0
    min_lookahead: 0.50
    max_lookahead: 1.50
    slowdown_distance: 1.20
    goal_tolerance: 0.30
    progress_search_ahead: 200
    progress_backtrack: 3
    odom_timeout_sec: 0.30
    valid_timeout_sec: 0.50
    enable_timeout_sec: 0.50
    transform_timeout_sec: 0.05
    base_frame: base_link
    expected_path_frame: map
