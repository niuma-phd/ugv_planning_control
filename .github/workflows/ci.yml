name: ros2-humble-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install package dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro humble -r -y
      - name: Verify repository
        run: python3 scripts/verify_repository.py
      - name: Build Subject 2 production packages
        shell: bash
        run: scripts/build_subject2.sh --clean
      - name: Build complete development workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
      - name: Subject 2 isolated runtime fixtures
        shell: bash
        run: |
          ROS_DOMAIN_ID=171 scripts/run_fixture_smoke.sh subject2
          ROS_DOMAIN_ID=172 scripts/run_fixture_smoke.sh subject2_right
          ROS_DOMAIN_ID=173 scripts/run_fixture_smoke.sh subject2_line
          ROS_DOMAIN_ID=174 scripts/run_fixture_smoke.sh subject2_waypoint_file
