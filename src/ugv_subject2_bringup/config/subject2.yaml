lio_odom_adapter:
  ros__parameters:
    input_topic: /livox_odometry_mapped
    output_topic: /localization/odom
    raw_world_frame: world
    raw_lidar_frame: livox_frame
    odom_frame: odom
    base_frame: base_link
    # Launch enables this only after all six base_link -> livox_frame values
    # and their provenance are supplied explicitly.
    extrinsics_valid: false

map_odom_manager:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    # Field contract: map and odom origins/axes are aligned manually.
    auto_align_from_path: false
    publish_rate_hz: 20.0
    initial.x: 0.0
    initial.y: 0.0
    initial.z: 0.0
    initial.roll: 0.0
    initial.pitch: 0.0
    initial.yaw: 0.0

gga_serial:
  ros__parameters:
    # The launch file creates this optional node only when a complete, explicit
    # serial configuration is supplied. GPS is not a control input.
    antenna_frame: gps_link
    fix_topic: /gps/fix
    position_valid_topic: /gps/gga_position_valid
    raw_sentence_topic: /gps/gga_sentence
    poll_rate_hz: 50.0
    status_rate_hz: 5.0
    fix_timeout_sec: 1.0
    reconnect_period_sec: 2.0
    maximum_sentence_length: 128
    accepted_sentence_ids: [GPGGA]
    quality_profile_valid: false
    accepted_fix_qualities: [1, 2, 4, 5, 6, 8, 9]
    minimum_satellites: 1
    maximum_hdop: 99.0

waypoint_controller_node:
  ros__parameters:
    # Cruise request and hard cap are intentionally separate. The current
    # requested cruise remains 0.50 m/s; the user-set cap is 1.00 m/s.
    nominal_speed: 0.50
    max_speed: 1.00
    max_yaw_rate: 0.40
    max_curvature: 1.00
    turn_in_place_threshold_rad: 1.0472
    slowdown_distance: 1.20
    waypoint_tolerance: 0.30
    goal_tolerance: 0.30
    transform_timeout_sec: 0.05
    odom_topic: /localization/odom
    odom_frame: odom
    base_frame: base_link
    expected_path_frame: map
